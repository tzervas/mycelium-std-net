[package]
name = "mycelium-std-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "std.net — blocking HTTPS client (ureq+rustls) + wild:http_request host registry (WP-6 / S-STD-NET; spike S3 TLS)"
publish = false

[features]
# PrimRegistry install surface (WP-6 / S-STD-NET): depends on mycelium-interp's
# PrimRegistry::register_host API (mycelium-runtime main / runtime#12 A1 reconcile). Off by default so
# pure client consumers (gha-runner-ctl, tg-agent-relay) stay light.
default = []
host-registry = ["dep:mycelium-interp", "dep:mycelium-core"]

[dependencies]
# Blocking HTTPS client (spike S3 locked: ureq + rustls). Default features = rustls + gzip.
ureq = { version = "3.3.0", default-features = true }

# Feature-gated: PrimRegistry dispatch table (interp) + Value encoding (core).
# Pin mycelium-interp to mycelium-runtime main tip (A1 PrimRegistry reconcile, runtime#12).
mycelium-interp = { git = "https://github.com/tzervas/mycelium-runtime", rev = "cfd2031ca12233e8ef97ab344d37f4399d8a157e", optional = true }
# Same core rev as mycelium-interp on that tip (encoding helpers + Value construction).
mycelium-core = { git = "https://github.com/tzervas/mycelium-core", rev = "46d2515cbd86d2ae4d1365f4adcd2796737e9f0b", optional = true }

[lints]
workspace = true

# --- standalone workspace root (course-correction Phase B, 2026-07-18; steer handoff §6.2) ---
[workspace]

[workspace.package]
version = "0.464.0"
edition = "2021"
rust-version = "1.96.1"
license = "MIT"
repository = "https://github.com/tzervas/mycelium-std-net"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"

[workspace.lints.rust]
# ADR-014: unsafe permitted-but-documented; the check is clippy::undocumented_unsafe_blocks.
unsafe_code = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

# G2 never-silent arithmetic: release builds panic on overflow (monorepo parity).
[profile.release]
overflow-checks = true
